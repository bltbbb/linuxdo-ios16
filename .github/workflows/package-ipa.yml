name: Package IPA

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: package-ipa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    name: archive → ipa (Release, iOS 16)
    runs-on: macos-15
    timeout-minutes: 40

    # 可选签名：在仓库 Settings → Secrets 里配好这四项后，自动走签名流程。
    # 不配也能出未签名 ipa（可用 Sideloadly / AltStore 本地重签安装）。
    env:
      BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
      P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
      PROVISION_PROFILE_BASE64: ${{ secrets.PROVISION_PROFILE_BASE64 }}
      TEAM_ID: ${{ secrets.TEAM_ID }}
      KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Toolchain info
        run: |
          xcodebuild -version
          swift --version
          xcrun --sdk iphoneos --show-sdk-version

      - name: Install XcodeGen
        run: |
          if ! command -v xcodegen >/dev/null 2>&1; then brew install xcodegen; fi
          xcodegen --version

      # DoH + ECH 本地代理：把 fluxdo_doh 交叉编译成 iOS arm64 静态库
      - name: Build DoH proxy (Rust, iOS arm64)
        run: |
          set -euo pipefail
          rustup target add aarch64-apple-ios
          git clone https://github.com/1molchuan/fluxdo_doh rust-src
          git -C rust-src checkout f1a1e96d74a696508bfbbb9c62b11f3c4d9a9b2a
          cd rust-src
          # 只用 staticlib：iOS 不接受这个 crate 默认的 cdylib 产出
          cargo rustc --release --locked --target aarch64-apple-ios --features ech --lib --crate-type staticlib
          mkdir -p ../rust/lib
          cp target/aarch64-apple-ios/release/libdoh_proxy.a ../rust/lib/
          ls -lh ../rust/lib

      - name: Generate Xcode project
        run: |
          xcodegen generate
          echo "--- 桥接头解析结果 ---"
          xcodebuild -project LinuxDoClient.xcodeproj -target LinuxDoClient -showBuildSettings 2>/dev/null | grep -i "BRIDGING_HEADER" || echo "(未解析到)"

      # ---------- 可选：导入签名身份 ----------
      - name: Import signing certificate and profile
        if: env.BUILD_CERTIFICATE_BASE64 != '' && env.PROVISION_PROFILE_BASE64 != ''
        run: |
          set -euo pipefail
          CERT_PATH="$RUNNER_TEMP/build_certificate.p12"
          PROFILE_PATH="$RUNNER_TEMP/build_profile.mobileprovision"
          KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"

          echo -n "$BUILD_CERTIFICATE_BASE64" | base64 --decode -o "$CERT_PATH"
          echo -n "$PROVISION_PROFILE_BASE64" | base64 --decode -o "$PROFILE_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH"

          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp "$PROFILE_PATH" ~/Library/MobileDevice/Provisioning\ Profiles/

      # ---------- Archive ----------
      - name: Archive (Release)
        run: |
          set -o pipefail
          if [ -n "${BUILD_CERTIFICATE_BASE64:-}" ] && [ -n "${PROVISION_PROFILE_BASE64:-}" ]; then
            echo "== 签名模式（Development / Ad Hoc） =="
            SIGN_ARGS=(-allowProvisioningUpdates
              CODE_SIGN_STYLE=Manual
              DEVELOPMENT_TEAM="$TEAM_ID")
          else
            echo "== 未签名模式 =="
            SIGN_ARGS=(CODE_SIGNING_ALLOWED=NO
              CODE_SIGNING_REQUIRED=NO
              CODE_SIGN_IDENTITY="")
          fi

          xcodebuild archive \
            -project LinuxDoClient.xcodeproj \
            -scheme LinuxDoClient \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/LinuxDoClient.xcarchive \
            "${SIGN_ARGS[@]}" \
            2>&1 | tee archive.log

      # ---------- 组 ipa ----------
      - name: Build .ipa from archive
        run: |
          set -euo pipefail
          APP="build/LinuxDoClient.xcarchive/Products/Applications/LinuxDoClient.app"
          test -d "$APP" || { echo "::error::archive 里没有 .app"; ls -R build | head -50; exit 1; }

          rm -rf build/Payload
          mkdir -p build/Payload
          cp -R "$APP" build/Payload/

          # 无证书时做 ad-hoc 伪签名：TrollStore / 越狱环境可直接安装。
          # 完全未签名的 Mach-O 会被部分安装器判为损坏包。
          if [ -z "${BUILD_CERTIFICATE_BASE64:-}" ]; then
            echo "== ad-hoc 伪签名（TrollStore 可直接安装） =="
            codesign -f -s - --timestamp=none --generate-entitlement-der build/Payload/LinuxDoClient.app
          fi

          VERSION=$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" "$APP/Info.plist")
          OUT="LinuxDoClient-${VERSION}-unsigned.ipa"
          # 用 ditto 而不是 zip：Apple 官方打包 ipa 的方式，保留扩展属性与符号链接，
          # zip 在 macOS 上可能丢元数据。产物仍是标准 ipa（Payload/ 结构）。
          ( cd build && ditto -c -k --sequesterRsrc --keepParent Payload "../$OUT" )
          echo "IPA=$OUT" >> "$GITHUB_ENV"
          ls -lh "$OUT"

      # ---------- 产物校验 ----------
      - name: Verify packaged ipa
        run: |
          set -euo pipefail
          echo "--- ipa 内容 ---"
          unzip -l "$IPA" | head -20

          echo "--- MinimumOSVersion ---"
          MINOS=$(/usr/libexec/PlistBuddy -c "Print :MinimumOSVersion" build/Payload/LinuxDoClient.app/Info.plist)
          echo "MinimumOSVersion = $MINOS"
          test "$MINOS" = "16.0" || { echo "::error::MinimumOSVersion is '$MINOS'"; exit 1; }

          echo "--- Mach-O LC_BUILD_VERSION ---"
          otool -l build/Payload/LinuxDoClient.app/LinuxDoClient | grep -A5 LC_BUILD_VERSION

          echo "--- 强链接检查：不得出现 iOS 17 独有库 ---"
          python3 Scripts/check_ios16_links.py build/Payload/LinuxDoClient.app/LinuxDoClient

          echo "--- 确认不是 Debug 包（不应出现 debug dylib） ---"
          if ls build/Payload/LinuxDoClient.app/*.debug.dylib >/dev/null 2>&1; then
            echo "::error::Release 包里出现了 debug dylib，装到设备上会启动失败"; exit 1
          fi
          echo "ok: 无 debug dylib"

          echo "--- 签名状态 ---"
          codesign -dv --verbose=2 build/Payload/LinuxDoClient.app 2>&1 || echo "(未签名 —— 需 Sideloadly 本地重签)"

      - name: Upload ipa
        uses: actions/upload-artifact@v4
        with:
          name: LinuxDoClient-ipa
          path: |
            *.ipa
            archive.log
          if-no-files-found: error
          retention-days: 30

      # tag（v*）构建自动发 Release：附件是原始 .ipa，直接可给 TrollStore 用，
      # 不再需要下载 artifact 的 zip 再解压。
      - name: Publish to GitHub Release (tag builds only)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="$GITHUB_REF_NAME"
          URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/${IPA}"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" "$IPA" --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" "$IPA" \
              --repo "$GITHUB_REPOSITORY" \
              --title "$TAG" \
              --notes "iOS 16.0 target / arm64 / ad-hoc signed / TrollStore ready. Install: TrollStore -> + -> Install IPA from URL -> $URL"
          fi
          echo "直链: $URL" >> "$GITHUB_STEP_SUMMARY"

      - name: Print install URL
        if: always()
        run: |
          echo "### 安装直链" >> "$GITHUB_STEP_SUMMARY"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/${IPA}" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "本次是手动构建（未打 tag），产物在 Artifacts 里；打 tag 推送会自动发 Release 直链。" >> "$GITHUB_STEP_SUMMARY"
          fi
