name: iOS Build

on:
  # 只在 PR 和手动触发时跑：main 的每次推送都由 Package IPA 负责编译，
  # 避免一次发布构建两遍。
  pull_request:
  workflow_dispatch:

concurrency:
  group: ios-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: xcodebuild (deployment target iOS 16.0, no signing)
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Toolchain info
        run: |
          xcodebuild -version
          swift --version
          echo "--- iPhoneOS SDK ---"
          xcrun --sdk iphoneos --show-sdk-version
          xcrun --sdk iphoneos --show-sdk-path

      - name: Install XcodeGen
        run: |
          if ! command -v xcodegen >/dev/null 2>&1; then
            brew install xcodegen
          fi
          xcodegen --version

      # 与 Package IPA 保持一致：链接 Rust 静态库才能编译
      # 测试跑在模拟器上，需要额外的 ios-sim 切片，用 lipo 合成通用库
      - name: Build DoH proxy (Rust, iOS + simulator)
        run: |
          set -euo pipefail
          rustup target add aarch64-apple-ios aarch64-apple-ios-sim
          git clone https://github.com/1molchuan/fluxdo_doh rust-src
          git -C rust-src checkout f1a1e96d74a696508bfbbb9c62b11f3c4d9a9b2a
          mkdir -p rust-src/certs
          cp rust/certs/ca.crt rust/certs/ca.key rust-src/certs/
          cd rust-src
          for target in aarch64-apple-ios aarch64-apple-ios-sim; do
            cargo rustc --release --locked --target "$target" --features ech --lib --crate-type staticlib
          done
          mkdir -p ../rust/lib
          lipo -create \
            target/aarch64-apple-ios/release/libdoh_proxy.a \
            target/aarch64-apple-ios-sim/release/libdoh_proxy.a \
            -output ../rust/lib/libdoh_proxy.a
          ls -lh ../rust/lib

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Show project (debug aid)
        run: |
          xcodebuild -list -project LinuxDoClient.xcodeproj

      - name: Build
        run: |
          set -o pipefail
          xcodebuild \
            -project LinuxDoClient.xcodeproj \
            -scheme LinuxDoClient \
            -configuration Debug \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            ENABLE_USER_SCRIPT_SANDBOXING=NO \
            build 2>&1 | tee build.log

      - name: Verify artifact really targets iOS 16
        run: |
          APP="build/Build/Products/Debug-iphoneos/LinuxDoClient.app"
          echo "--- Info.plist MinimumOSVersion ---"
          MINOS=$(/usr/libexec/PlistBuddy -c "Print :MinimumOSVersion" "$APP/Info.plist")
          echo "MinimumOSVersion = $MINOS"
          test "$MINOS" = "16.0" || { echo "::error::MinimumOSVersion is '$MINOS', expected 16.0"; exit 1; }
          echo "--- Mach-O LC_BUILD_VERSION (minos / sdk) ---"
          otool -l "$APP/LinuxDoClient" | grep -A5 LC_BUILD_VERSION
          echo "--- linked frameworks that iOS 16 does NOT have (should be empty) ---"
          otool -L "$APP/LinuxDoClient" | grep -Ei 'SwiftData|TipKit|Symbols\.framework|swiftObservation' || echo "(none — good)"

      - name: Run unit tests on simulator
        run: |
          set -o pipefail
          # runner 镜像之间可用机型不一致，动态挑一台 iPhone
          DEST_UDID=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          data = json.load(sys.stdin)["devices"]
          for runtime, devices in sorted(data.items(), reverse=True):
              if "iOS" not in runtime:
                  continue
              for device in devices:
                  if device.get("name", "").startswith("iPhone"):
                      print(device["udid"])
                      raise SystemExit
          raise SystemExit("no iPhone simulator found")
          ')
          echo "simulator=$DEST_UDID"
          xcodebuild test \
            -project LinuxDoClient.xcodeproj \
            -scheme LinuxDoClient \
            -configuration Debug \
            -destination "id=$DEST_UDID" \
            -derivedDataPath build-tests \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            2>&1 | tee test.log

      - name: Extract test results
        if: always()
        run: |
          echo "=== failing tests ==="
          grep -E "error:|✘|failed" test.log | head -40 || echo "(none)"
          echo "=== summary ==="
          grep -E "Test Suite .* (passed|failed)|Executed [0-9]+ test" test.log | tail -10 || true

      - name: Extract errors
        if: always()
        run: |
          echo "=== error: lines ==="
          grep -n "error:" build.log || echo "(none)"
          echo "=== warning summary ==="
          grep -c "warning:" build.log || true

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: warn
