name: LinuxDoClient
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    IPHONEOS_DEPLOYMENT_TARGET: "16.0"
    TARGETED_DEVICE_FAMILY: "1"
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: NO

targets:
  LinuxDoClient:
    type: application
    platform: iOS
    sources:
      - path: Sources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.linuxdoclient
        PRODUCT_NAME: LinuxDoClient
        MARKETING_VERSION: "1.5.3"
        CURRENT_PROJECT_VERSION: "153"
        # DoH + ECH 本地代理：fluxdo_doh（GPL-3.0）交叉编译出的 Rust 静态库，CI 里构建
        SWIFT_OBJC_BRIDGING_HEADER: "$(SRCROOT)/Sources/Support/DohProxyBridge.h"
        # 真机与模拟器各用各的切片：静态库两者都是 arm64，无法合成通用包
        "LIBRARY_SEARCH_PATHS[sdk=iphoneos*]":
          - "$(SRCROOT)/rust/lib/device"
        "LIBRARY_SEARCH_PATHS[sdk=iphonesimulator*]":
          - "$(SRCROOT)/rust/lib/sim"
        OTHER_LDFLAGS:
          - "-ldoh_proxy"
          - "-lc++"
          - "-liconv"
          - "-lresolv"
          - "-framework"
          - "Security"
          - "-framework"
          - "CoreFoundation"
        # Info.plist 由 XcodeGen 依据下方 info.properties 生成，不参与资源拷贝
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: LINUX DO
        CFBundleShortVersionString: "1.5.3"
        CFBundleVersion: "153"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIRequiresFullScreen: true
        UIApplicationSupportsIndirectInputEvents: true
        ITSAppUsesNonExemptEncryption: false
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: false
          NSAllowsArbitraryLoadsInWebContent: true

  LinuxDoClientTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
    dependencies:
      - target: LinuxDoClient
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES

schemes:
  LinuxDoClient:
    build:
      targets:
        LinuxDoClient: all
    run:
      config: Debug
    archive:
      config: Release
    test:
      targets:
        - LinuxDoClientTests
