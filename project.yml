name: LinuxDoClient
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    IPHONEOS_DEPLOYMENT_TARGET: "16.0"
    TARGETED_DEVICE_FAMILY: "1"
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: NO

targets:
  LinuxDoClient:
    type: application
    platform: iOS
    sources:
      - path: Sources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.linuxdoclient
        PRODUCT_NAME: LinuxDoClient
        MARKETING_VERSION: "1.1.1"
        CURRENT_PROJECT_VERSION: "101"
        # DoH + ECH 鏈湴浠ｇ悊锛歠luxdo_doh锛圙PL-3.0锛変氦鍙夌紪璇戝嚭鐨?Rust 闈欐€佸簱锛孋I 閲屾瀯寤?        SWIFT_OBJC_BRIDGING_HEADER: "Sources/Support/DohProxyBridge.h"
        LIBRARY_SEARCH_PATHS:
          - "$(SRCROOT)/rust/lib"
        OTHER_LDFLAGS:
          - "-ldoh_proxy"
          - "-lc++"
          - "-liconv"
          - "-lresolv"
          - "-framework"
          - "Security"
          - "-framework"
          - "CoreFoundation"
        # Info.plist 鐢?XcodeGen 渚濇嵁涓嬫柟 info.properties 鐢熸垚锛屼笉鍙備笌璧勬簮鎷疯礉
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: LINUX DO
        CFBundleShortVersionString: "1.1.1"
        CFBundleVersion: "101"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIRequiresFullScreen: true
        UIApplicationSupportsIndirectInputEvents: true
        ITSAppUsesNonExemptEncryption: false
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: false
          NSAllowsArbitraryLoadsInWebContent: true

  LinuxDoClientTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
    dependencies:
      - target: LinuxDoClient
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES

schemes:
  LinuxDoClient:
    build:
      targets:
        LinuxDoClient: all
    run:
      config: Debug
    archive:
      config: Release
    test:
      targets:
        - LinuxDoClientTests
