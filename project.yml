name: LinuxDoClient
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    IPHONEOS_DEPLOYMENT_TARGET: "16.0"
    TARGETED_DEVICE_FAMILY: "1"
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: NO

targets:
  LinuxDoClient:
    type: application
    platform: iOS
    sources:
      - path: Sources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.linuxdoclient
        PRODUCT_NAME: LinuxDoClient
        MARKETING_VERSION: "1.0.6"
        CURRENT_PROJECT_VERSION: "6"
        # Info.plist 由 XcodeGen 依据下方 info.properties 生成，不参与资源拷贝
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: LINUX DO
        CFBundleShortVersionString: "1.0.6"
        CFBundleVersion: "6"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIRequiresFullScreen: true
        UIApplicationSupportsIndirectInputEvents: true
        ITSAppUsesNonExemptEncryption: false
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: false
          NSAllowsArbitraryLoadsInWebContent: true
        # User API Key 授权完成后由站点 302 回这个 scheme
        CFBundleURLTypes:
          - CFBundleURLName: com.example.linuxdoclient
            CFBundleURLSchemes:
              - linuxdoclient

schemes:
  LinuxDoClient:
    build:
      targets:
        LinuxDoClient: all
    run:
      config: Debug
    archive:
      config: Release
